name: Annotation Linux checks

on:
  push:
    branches: [main]
    paths:
      - 'src/renderer/player/annotation*'
      - 'src/renderer/player/liveInk.ts'
      - 'src/renderer/editor/canvas.ts'
      - 'test/liveInk.test.ts'
      - 'test/pathShapeCanvas.test.ts'
      - 'src/renderer/presenter/**'
      - 'src/shared/annotations.ts'
      - 'src/shared/ipc.ts'
      - 'test/annotation*'
      - 'test/speakerView.test.ts'
      - '.github/workflows/annotations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/electron-system-deps
      - run: npm ci
      - run: npm run typecheck
      - name: Pen settings and presenter component tests
        run: npx vitest run test/annotationTools.test.ts test/speakerView.test.ts test/liveInk.test.ts test/pathShapeCanvas.test.ts
      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Desktop, browser, external-display and PDF tests
        env:
          CI_NO_WINDOW_MANAGER: '1'
        run: xvfb-run -a --server-args="-screen 0 2560x1440x24" npx vitest run --config vitest.browser.config.ts test/annotationPresentationBrowser.test.ts test/presentSwitchDisplaysBrowser.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-annotation-previews
          if-no-files-found: ignore
          path: |
            /tmp/deckwerk-annotations-*.png
            /tmp/deckwerk-presenter-controls-*.png
            /tmp/deckwerk-annotations-*.pdf
            /tmp/deckwerk-ink-budget.json
            /tmp/deckwerk-editor-ink-budget.json
